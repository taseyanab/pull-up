<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pull Up</title>
<meta name="description" content="Pull Up: Atlanta parties, day parties and open mics. All in prices, instant payouts for hosts, and a crew marketplace for DJs, security and vendors.">
<meta name="theme-color" content="#E3174D">
<meta property="og:title" content="Pull Up · Find what's popping in the A">
<meta property="og:description" content="Atlanta tickets with no surprise fees. Hosts get paid fast. DJs, security and vendors get booked.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='14' fill='%23E3174D' stroke='%232B0A14' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%23FFD23F'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Pull Up: butter yellow + cherry red on cream, wine ink. Sticker style: thick ink borders, hard offset shadows, bouncy taps. Phone column, bottom tabs, sheets for flows. */
:root{
  --bg:#FFF6E8;
  --card:#FFFBF3;
  --card2:#FFF0D6;
  --ink:#2B0A14;
  --muted:#7A5560;
  --line:#2B0A14;
  --soft:#F3DDBE;
  --yellow:#FFD23F;
  --cherry:#E3174D;
  --pink:#FF8FB1;
  --blush:#FFD6E1;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fg:#1F0A12;
  --hair:rgba(43,10,20,.10);
  --fill:rgba(118,82,92,.10);
  --tint:rgba(227,23,77,.10);
  --sh:#2B0A14;
  --shadow:3px 3px 0 var(--sh);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--cherry);outline-offset:2px;border-radius:10px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){body{background:var(--yellow) radial-gradient(var(--ink) 1.2px,transparent 1.6px) 0 0/18px 18px}.app{border-left:2px solid var(--line);border-right:2px solid var(--line)}}
main{flex:1;padding:0 16px 110px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line)}
.logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.logo .mark{width:30px;height:30px;border-radius:9px;background:var(--cherry);border:2px solid var(--line);display:grid;place-items:center;transform:rotate(-8deg);box-shadow:2px 2px 0 var(--sh)}
.logo .mark i{width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.city{font-size:12px;font-weight:700;border:2px solid var(--line);padding:5px 10px;border-radius:999px;background:var(--yellow)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:34px;font-weight:800;line-height:1}
h2{font-size:21px;font-weight:800}
h3{font-size:17px;font-weight:800}
.sub{color:var(--muted);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.hero{padding:18px 0 12px;display:flex;flex-direction:column;gap:8px}
.hero h1 em{font-style:normal;background:var(--yellow);padding:0 6px;border-radius:8px;box-shadow:inset 0 -6px 0 var(--pink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--line);background:var(--card);padding:7px 14px;border-radius:999px;font-weight:700;font-size:13px}
.chip[aria-pressed="true"]{background:var(--cherry);color:#fff;box-shadow:2px 2px 0 var(--sh)}
.note{font-size:13px;background:var(--card2);border:2px dashed var(--line);border-radius:14px;padding:10px 12px}
.note.warn{background:var(--blush)}

/* flyers */
.poster{border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:9px;font-family:var(--display);font-weight:800;line-height:.92;border:2px solid var(--line)}
.poster .pt{font-size:15px;text-wrap:balance;position:relative}
.poster.big{height:300px;border-radius:0;border-width:0 0 2px;padding:22px 18px}
.poster.big .pt{font-size:50px;letter-spacing:-.03em}
.sticker{position:absolute;top:16px;right:16px;background:var(--yellow);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-family:var(--body);font-weight:800;font-size:13px;transform:rotate(6deg);box-shadow:var(--shadow)}

/* event cards */
.card{display:grid;grid-template-columns:100px 1fr;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:10px;width:100%;text-decoration:none;box-shadow:var(--shadow)}
.card .poster{aspect-ratio:4/5}
.card .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.when{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cherry)}
.card h3{font-size:19px;overflow-wrap:anywhere}
.where{font-size:13px;color:var(--muted)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px}
.price{font-weight:800;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--card2);border:2px solid var(--line);white-space:nowrap}
.pill.hot{background:var(--cherry);color:#fff}
.pill.yes{background:var(--yellow)}
.pill.pink{background:var(--pink)}
.pill.bad{background:var(--ink);color:#fff}
.faces{display:flex;align-items:center;gap:10px;font-size:13px}
.faces .av{display:flex}
.faces .av span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid var(--line);margin-left:-8px}
.faces .av span:first-child{margin-left:0}

/* event page */
.back{position:absolute;top:14px;left:14px;z-index:3;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14px;text-decoration:none;box-shadow:2px 2px 0 var(--sh)}
.back.r{left:auto;right:14px}
.ev-body{padding:18px 0 0;display:flex;flex-direction:column;gap:16px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--muted)}
.fact .v{font-weight:700;margin-top:2px}
.band{border-radius:16px;padding:12px 14px;background:var(--pink);border:2px solid var(--line)}
.band .k{color:var(--ink)}
.faq details{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.faq summary{font-weight:800;cursor:pointer}
.faq p{margin:6px 0 0;color:var(--muted)}
.tier{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px 12px 18px;width:100%;text-align:left;position:relative;overflow:hidden}
.tier::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--tc,var(--yellow));border-right:2px solid var(--line)}
.tier[data-sel="true"]{box-shadow:4px 4px 0 var(--cherry);transform:translate(-1px,-1px)}
.tier:disabled{opacity:.5;cursor:not-allowed}
.tier .nm{font-weight:800}
.tier .ds{font-size:13px;color:var(--muted)}
.tier .perks{font-size:12px;font-weight:700;color:var(--fg);margin-top:3px}
.tier .pr{text-align:right;font-variant-numeric:tabular-nums}
.tier .pr b{display:block;font-size:18px}
.tier .pr small{color:var(--muted);font-size:12px}
.bar{height:8px;border-radius:99px;background:var(--card2);border:2px solid var(--line);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--cherry)}
.lock{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
.codebox{display:flex;gap:8px}
.codebox input{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:9px 12px;text-transform:uppercase}

/* buttons */
.btn{border:2px solid var(--line);border-radius:14px;padding:11px 18px;font-weight:800;background:var(--cherry);color:#fff;font-size:15px;box-shadow:var(--shadow);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.w{background:var(--card);color:var(--ink)}
.btn.ink{background:var(--ink);color:#fff}
.btn.full{width:100%}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px;box-shadow:2px 2px 0 var(--sh)}
.btn,.chip,.card,.tier{transition:transform .18s cubic-bezier(.3,1.7,.5,1),box-shadow .18s}
.btn:active,.chip:active,.card:active,.tier:active{transform:translate(2px,2px) scale(.98);box-shadow:0 0 0 var(--sh)}
.actions2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buy bar + tabs */
.buybar{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:min(480px,100%);padding:10px 14px;z-index:6}
.buybar .inner{display:flex;align-items:center;gap:12px;background:var(--yellow);border:2px solid var(--line);border-radius:20px;padding:9px 9px 9px 14px;box-shadow:var(--shadow)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:17px}
.qty span{min-width:18px;text-align:center;font-weight:800}
.total{flex:1;min-width:0}
.total b{font-size:19px;font-variant-numeric:tabular-nums}
.total small{display:block;font-size:12px;font-weight:600}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);z-index:7;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;color:#F3DDBE;text-decoration:none;font-size:11.5px;font-weight:700;border-radius:14px}
nav.tabs a[aria-current="page"]{background:var(--yellow);color:var(--ink)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{position:relative;display:flex}
.badge[data-n]::after{content:attr(data-n);position:absolute;top:-6px;right:-11px;background:var(--cherry);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px;border:2px solid var(--line)}

/* tickets */
.ticket{background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;position:relative;box-shadow:var(--shadow)}
.ticket .tt{padding:16px 18px 14px;background:var(--tc,var(--yellow));border-bottom:2px dashed var(--line)}
.ticket h3{font-size:24px;margin-top:2px}
.ticket .tb{display:grid;grid-template-columns:120px 1fr;gap:14px;padding:14px 18px 18px;align-items:center}
.ticket .code{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:15px}
.ticket .addr{font-size:13px;background:rgba(255,255,255,.7);border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.ticket.used{opacity:.7}
.stamp{position:absolute;top:14px;right:14px;border:2.5px solid var(--cherry);color:var(--cherry);font-weight:800;font-size:12px;padding:3px 8px;border-radius:8px;transform:rotate(8deg);background:#fff}

/* host */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.stat .n{font-family:var(--display);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums}
.stat .k{text-transform:none;letter-spacing:0;font-size:12px}
.stat.y{background:var(--yellow)}.stat.p{background:var(--pink)}
.payout{background:var(--cherry);color:#fff;border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.payout .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.payout .sub{color:#FFD6E1}
.hcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
table.rows{width:100%;border-collapse:collapse;font-size:13px}
table.rows td{padding:7px 0;border-top:1.5px dashed var(--soft);vertical-align:top}
table.rows td:last-child{text-align:right}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:10px;font-weight:800;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chart{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.chart svg{display:block;width:100%;height:auto}
.lb{display:flex;flex-direction:column;gap:8px}
.lb .r{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:9px 12px;font-variant-numeric:tabular-nums}
.lb .rk{font-family:var(--display);font-weight:800;font-size:20px}
.lb .r:first-child{background:var(--yellow)}
.lb .r small{display:block;color:var(--muted);font-size:12px}
.list{border:2px solid var(--line);border-radius:16px;padding:12px;background:var(--card2);display:flex;flex-direction:column;gap:8px}
.list .row b{font-size:15px}

/* door */
.guest{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.guest .who{flex:1;min-width:0}
.guest .who b{display:block;overflow-wrap:anywhere}
.guest .who small{color:var(--muted)}
.result{border-radius:18px;padding:16px;font-weight:700;display:flex;gap:12px;align-items:center;border:2px solid var(--line);box-shadow:var(--shadow)}
.result b{font-family:var(--display);font-size:24px}
.result.ok{background:var(--yellow)}
.result.no{background:var(--cherry);color:#fff}
.result.dup{background:var(--pink)}

/* forms + sheet */
.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea,.search input,.search select{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
.field textarea{min-height:72px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0}
.search select{width:auto;max-width:44%}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
.toggle input{width:20px;height:20px;accent-color:var(--cherry)}
.scrim{position:fixed;inset:0;background:rgba(43,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(480px,100%);max-height:94%;overflow:auto;background:var(--bg);border:2px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px 26px}
.grab{width:46px;height:6px;border-radius:9px;background:var(--ink);margin:0 auto 14px}
.lines{display:flex;flex-direction:column;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.lines .row{justify-content:space-between}
.lines .tot{border-top:2px solid var(--line);padding-top:8px;font-weight:800;font-size:17px}
.steps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:-16px;background:var(--bg);padding:8px 0;z-index:2}
.steps button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px}
.steps button[aria-pressed="true"]{background:var(--yellow);box-shadow:2px 2px 0 var(--sh)}
.preview{display:grid;grid-template-columns:86px 1fr;gap:12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px}
.preview .poster{aspect-ratio:4/5}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:12px;border:2px solid var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.pats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pat{height:54px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:12px;display:flex;align-items:flex-end;padding:5px 8px}
.pat[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.tedit{border:2px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.tedit .stub{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:10px 10px 10px 0;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.tedit .stub i{align-self:stretch;background:var(--tc);border-right:2px solid var(--line)}
.tedit .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;border-top:2px dashed var(--soft)}
.tedit .tools{display:flex;gap:6px}
.iconbtn{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:800}
.faqrow{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:#fff;font-weight:700;padding:11px 16px;border-radius:14px;z-index:30;font-size:14px;max-width:90%;text-align:center;border:2px solid var(--yellow)}
.empty{text-align:center;padding:36px 10px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.skeleton{height:120px;border-radius:20px;background:linear-gradient(90deg,var(--card2),var(--card),var(--card2));background-size:200% 100%;animation:sh 1.3s infinite;border:2px solid var(--soft)}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:scale(1)}}
.pop{animation:pop .35s cubic-bezier(.3,1.7,.5,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.avatar{display:inline-grid;place-items:center;border-radius:50%;border:2px solid var(--line);font-family:var(--display);font-weight:800;box-shadow:2px 2px 0 var(--sh);flex:none}
.live{background:var(--card);border:2px solid var(--cherry);border-radius:20px;padding:14px;box-shadow:3px 3px 0 var(--cherry);display:flex;flex-direction:column;gap:10px}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.55}}
.fits{display:flex;gap:10px;overflow-x:auto;padding:2px 4px 10px 2px;scrollbar-width:none}
.fits::-webkit-scrollbar{display:none}
.fit{flex:none;width:132px;display:flex;flex-direction:column;gap:6px}
.fimg{height:168px;border-radius:16px;border:2px solid var(--line);background-size:cover;background-position:center;position:relative;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;box-shadow:var(--shadow)}
.crown{position:absolute;top:6px;left:8px;font-size:20px}
.firebtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 9px;font-weight:800;font-size:13px;flex:none}
.firebtn[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:flex;gap:12px;align-items:center;padding:9px 12px;border:2px solid var(--line);border-radius:14px;background:var(--card)}
.set.now{background:var(--yellow);color:var(--ink)}
.set .time{font-variant-numeric:tabular-nums;min-width:66px}
.safe{display:flex;gap:6px;flex-wrap:wrap;padding:0 18px 16px}
.onb{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center;overflow:auto}

.onb .logo .mark{width:26px;height:26px}
.rolecard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);color:var(--fg)}

.savebar{position:sticky;bottom:-26px;display:grid;grid-template-columns:1fr 2fr;gap:8px;background:var(--bg);padding:10px 0 4px;margin-top:4px;border-top:2px solid var(--soft)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function soldFor(ev,tierId){let n=(ev.sample&&ev.sample.sold&&ev.sample.sold[tierId])||0;for(const o of realOrders())if(o.eventId===ev.id&&o.tierId===tierId&&o.status!=="refunded")n+=o.qty||1;return n;}
function evTotals(ev){let sold=0,cap=0,gross=0,fees=0;for(const t of ev.tiers||[]){const s=soldFor(ev,t.id),p=Number(t.price)||0;sold+=s;cap+=Number(t.qty)||0;gross+=s*p;fees+=s*fee(p);}for(const o of realOrders())if(o.eventId===ev.id&&o.discount)gross-=o.discount;return{sold,cap,gross,fees};}
function tierOpen(ev,t){if(t.dropAt&&Date.parse(t.dropAt)>Date.now())return false;const i=ev.tiers.indexOf(t);if((t.opensAfterPrev||/last call/i.test(t.name))&&i>0){const prev=ev.tiers[i-1];return soldFor(ev,prev.id)>=prev.qty;}return true;}
const visibleTiers=ev=>(ev.tiers||[]).filter(t=>!t.hidden||(S.unlocked[ev.id]||[]).includes(t.id));
function minPrice(ev){const pub=(ev.tiers||[]).filter(t=>!t.hidden);const open=pub.filter(t=>tierOpen(ev,t)&&soldFor(ev,t.id)<t.qty);const list=(open.length?open:pub).map(t=>Number(t.price)||0);return list.length?Math.min(...list):0;}
const isMine=o=>(S.uid&&o.buyerId===S.uid)||myLocal.includes(o.id);
const getEv=id=>S.events.find(e=>e.id===id);
const getGroup=id=>S.groups.find(g=>g.id===id);
const getList=id=>S.lists.find(l=>l.id===id);
function promoterBoard(ev){const map={};for(const p of (ev.sample&&ev.sample.promoters)||[])map[p.code]={...p};for(const o of realOrders())if(o.eventId===ev.id&&o.promoter){if(!map[o.promoter])map[o.promoter]={name:o.promoterName||o.promoter,code:o.promoter,sales:0};map[o.promoter].sales+=o.qty||1;}return Object.values(map).sort((a,b)=>b.sales-a.sales);}
function avgPrice(e){const ps=(e.tiers||[]).map(t=>Number(t.price)||0).filter(Boolean);return ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:0;}
function promoterOwed(e){return promoterBoard(e).reduce((a,p)=>a+p.sales*avgPrice(e)*PROMO_COMMISSION,0);}
function balance(){let earned=0;for(const e of S.events)earned+=evTotals(e).gross-promoterOwed(e);const out=S.payouts.reduce((a,p)=>a+(Number(p.amount)||0),0);return{earned,out,available:Math.max(0,r2(earned-out))};}

function codeSvg(code,size){const N=21,c=size/N;let h=hash(code),cells="";
 const finder=(x,y)=>`<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#2B0A14"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#2B0A14"/>`;
 const inF=(x,y)=>(x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;h^=h<<13;h^=h>>>17;h^=h<<5;h>>>=0;if(h%100<48)cells+=`<rect x="${x*c}" y="${y*c}" width="${c+.3}" height="${c+.3}"/>`;}
 return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Ticket code ${esc(code)}"><rect width="${size}" height="${size}" fill="#fff"/><g fill="#2B0A14">${cells}</g>${finder(0,0)}${finder(14,0)}${finder(0,14)}</svg>`;}

function salesChart(evs){
 const days=14,series=Array(days).fill(0);
 for(const e of evs){const d=(e.sample&&e.sample.daily)||[];for(let i=0;i<days;i++)series[i]+=d[d.length-days+i]||0;}
 const today=new Date();today.setHours(0,0,0,0);
 for(const o of realOrders()){if(!evs.some(e=>e.id===o.eventId))continue;const k=Math.floor((today-new Date(new Date(o.createdAt).setHours(0,0,0,0)))/864e5);if(k>=0&&k<days)series[days-1-k]+=o.qty||1;}
 const W=440,H=150,pl=28,pb=22,pt=10,max=Math.max(5,...series),step=Math.ceil(max/4/5)*5||5,top=step*4,bw=(W-pl)/days;
 let grid="";for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);grid+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" style="stroke:var(--soft)" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${step*i}</text>`;}
 const bars=series.map((v,i)=>{const h=(H-pt-pb)*(v/top),x=pl+i*bw+3,y=H-pb-h;return `<rect x="${x}" y="${y}" width="${bw-6}" height="${Math.max(0,h)}" rx="4" fill="${i===days-1?"#E3174D":"#FF8FB1"}" style="stroke:var(--line)" stroke-width="1.5"><title>${v} tickets</title></rect>`;}).join("");
 const lbl=[0,7,13].map(i=>{const d=new Date(today);d.setDate(d.getDate()-(days-1-i));return `<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${i===13?"Today":d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</text>`;}).join("");
 const total=series.reduce((a,b)=>a+b,0);
 return `<div class="chart"><div class="row between" style="margin-bottom:8px"><b>Tickets sold, last 14 days</b><span class="sub">${total} total · ${series[days-1]} today</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily ticket sales over the last 14 days">${grid}${bars}${lbl}</svg></div>`;
}

function adjMin(e,t){const s=toMin(e.start);let v=toMin(t);if(v<s-360)v+=1440;return v;}
function nowAdj(e){const d=new Date();let n=d.getHours()*60+d.getMinutes();if(n<toMin(e.start)-360)n+=1440;return n;}
function countdown(ms){const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`;}
function liveInfo(e){
 const cap=(e.tiers||[]).reduce((a,t)=>a+(Number(t.qty)||0),0);
 const realIn=S.orders.filter(o=>o.eventId===e.id&&o.checkedIn&&!o.sample).reduce((a,o)=>a+(o.qty||1),0)+S.lists.filter(l=>l.eventId===e.id).reduce((a,l)=>a+(l.entries||[]).filter(x=>x.checkedIn).reduce((b,x)=>b+(x.plus?2:1),0),0);
 const inside=realIn+((e.sample&&e.sample.inside)||0);
 const recent=S.orders.filter(o=>o.eventId===e.id&&o.checkedInAt&&Date.now()-o.checkedInAt<15*60e3).length;
 const wait=recent?Math.min(45,Math.round(recent*1.5)):((e.sample&&e.sample.wait)||0);
 const sets=(e.setTimes||[]).slice().sort((a,b)=>adjMin(e,a.t)-adjMin(e,b.t)),n=nowAdj(e);
 let cur=null,next=null;for(const s of sets){if(adjMin(e,s.t)<=n)cur=s;else if(!next)next=s;}
 return{cap,inside,wait,cur,next,started:n>=toMin(e.start)};
}

/* ---------- saved events, notifications, calendar, referrals, automations, tracked links, story card, security ---------- */
let saved=[];try{saved=JSON.parse(localStorage.getItem("pu_saved")||"[]");}catch(e){}
const isSaved=id=>saved.includes(id);
function toggleSave(id){saved=isSaved(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem("pu_saved",JSON.stringify(saved));}catch(e){}toast(isSaved(id)?"Saved. We'll remind you before tickets go up.":"Removed from saved.");render();}
function gcalLink(e){const d=x=>x.replace(/[-:]/g,"");const start=e.date+"T"+(e.start||"20:00")+":00";let endD=e.date;if(e.end&&toMin(e.end)<toMin(e.start||"20:00")){const n=new Date(e.date+"T12:00");n.setDate(n.getDate()+1);endD=n.toISOString().slice(0,10);}const end=endD+"T"+(e.end||"23:59")+":00";
 return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(e.title)+"&dates="+d(start)+"/"+d(end)+"&ctz=America/New_York&details="+encodeURIComponent((e.about||"")+"\n\nTickets on Pull Up: "+linkTo("e-"+e.id))+"&location="+encodeURIComponent(e.area+", Atlanta");}
let notifSeen=0;try{notifSeen=Number(localStorage.getItem("pu_notif_seen")||0);}catch(e){}
function notifs(){const out=[],now=Date.now();
 const mineEv=new Set([...S.orders.filter(isMine).map(o=>o.eventId),...saved]);
 for(const e of S.events){if(daysAway(e)<0)continue;
  if(mineEv.has(e.id))for(const u of (e.updates||[]).slice(-2))out.push({at:u.at,icon:"📣",t:`${e.title}: ${u.msg}`,href:"#e-"+e.id});
  for(const t of e.tiers||[])if(t.dropAt&&Date.parse(t.dropAt)>now&&(mineEv.has(e.id)||iFollow(e.host)))out.push({at:now-36e5,icon:"⏰",t:`${t.name} for ${e.title} drops in ${countdown(Date.parse(t.dropAt)-now)}`,href:"#e-"+e.id});
  if(iFollow(e.host)&&daysAway(e)<=14&&!mineEv.has(e.id))out.push({at:e.createdAt||now-2*864e5,icon:"🆕",t:`${e.host} dropped ${e.title} (${fmtDay(e)})`,href:"#e-"+e.id});
  if(isSaved(e.id)&&daysAway(e)<=2&&!S.orders.some(o=>o.eventId===e.id&&isMine(o)))out.push({at:now-6e5,icon:"🔥",t:`${e.title} is ${relDay(e).toLowerCase()} and selling fast. Grab your ticket.`,href:"#e-"+e.id});}
 for(const g of S.groups.filter(g=>myGroups.includes(g.id))){const n=(g.members||[]).length;out.push({at:g.createdAt||now,icon:"👯",t:`Group buy: ${n} of ${g.size} paid${n>=g.size?". Everyone's in!":""}`,href:"#g-"+g.id});}
 for(const p of S.profiles.filter(isMyProfile))for(const r of requestsFor(p.id).filter(r=>r.status==="pending"))out.push({at:r.createdAt,icon:"🎧",t:`${r.fromName} wants to book ${p.name}`,href:"#p-"+p.id});
 for(const a of S.ambassadors.filter(a=>a.userId===me()&&a.status==="approved")){const e=getEv(a.eventId);if(e)out.push({at:a.createdAt+1,icon:"💸",t:`You're approved to promote ${e.title}. Your code is ${a.code}.`,href:"#e-"+e.id});}
 for(const r of S.requests.filter(r=>myRequests.includes(r.id)&&r.status!=="pending")){const p=getProfile(r.profileId);if(p)out.push({at:r.decidedAt||r.createdAt,icon:r.status==="accepted"?"✅":"💬",t:`${p.name} ${r.status==="accepted"?"accepted your booking":r.status==="declined"?"declined your request":"read your message"}`,href:"#p-"+p.id});}
 return out.sort((a,b)=>b.at-a.at).slice(0,30);}
const unseen=()=>notifs().filter(n=>n.at>notifSeen).length;
function notifSheet(){const L=notifs();notifSeen=Date.now();try{localStorage.setItem("pu_notif_seen",String(notifSeen));}catch(e){}
 openSheet(`<div class="stack"><h2>Notifications</h2>${L.map(n=>`<a class="guest" href="${n.href}" style="text-decoration:none;color:inherit"><span style="font-size:22px">${n.icon}</span><div class="who"><b style="font-weight:600">${esc(n.t)}</b><small>${new Date(n.at).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}</small></div></a>`).join("")||`<div class="empty"><span style="font-size:40px">🔔</span><b>You're all caught up.</b><span>Follow organizers and save events to hear about drops first.</span></div>`}<button class="btn w full" id="nfClose">Close</button></div>`,()=>{$("#nfClose").onclick=closeSheet;$("#sheet").addEventListener("click",ev=>{if(ev.target.closest("a.guest"))closeSheet();});});renderBell();}

/* referrals */
function myRefCode(){const base=((ACCT&&ACCT.name)||"friend").split(" ")[0].toUpperCase().replace(/[^A-Z]/g,"").slice(0,8)||"FRIEND";return base+(hash(me())%90+10);}
let refEnsured=false;

const REF_OFF=2;
function refStats(){const c=myRefCode();const uses=S.orders.filter(o=>o.referral===c);const earned=uses.length*REF_OFF;const used=S.orders.filter(o=>isMine(o)&&o.creditUsed).reduce((a,o)=>a+o.creditUsed,0);return{code:c,friends:uses.length,earned,credit:Math.max(0,earned-used)};}
function referralCard(){if(!signedIn())return"";const R=refStats();return `<div class="hcard" style="gap:8px;margin-bottom:16px;border-color:var(--cherry)"><div class="row between"><b style="font-size:17px">Give $${REF_OFF}, get $${REF_OFF}</b><span class="pill yes">${R.friends} friend${R.friends===1?"":"s"} joined</span></div>

function securitySheet(){const A=ACCT;const devs=[["📱","This phone","Atlanta, GA · active now",true],["💻","Chrome on Mac","Atlanta, GA · 2 days ago",false]];
 const body=()=>`<label class="toggle" for="sec2"><span><b>Two step sign in</b><br><span class="sub" style="font-size:13px">Text a code every time you sign in on a new device</span></span><input type="checkbox" id="sec2" ${A.twoStep?"checked":""}></label>
  <label class="toggle" for="secAl"><span><b>Login alerts</b><br><span class="sub" style="font-size:13px">Text me when someone signs in to my account</span></span><input type="checkbox" id="secAl" ${A.loginAlerts!==false?"checked":""}></label>
  ${A.brand?`<label class="toggle" for="secPay"><span><b>Payout lock</b><br><span class="sub" style="font-size:13px">Hold payouts for 24 hours after bank or card changes</span></span><input type="checkbox" id="secPay" ${A.payoutLock!==false?"checked":""}></label>`:""}
  <div class="k">Signed in devices</div>${devs.map(([i,n,s,cur])=>`<div class="guest"><span style="font-size:22px">${i}</span><div class="who"><b>${n}</b><small>${s}</small></div>${cur?'<span class="pill yes">This device</span>':`<button type="button" class="btn w sm" data-signoutdev="1">Sign out</button>`}</div>`).join("")}
  <div class="k">Your data</div><button type="button" class="btn w full" id="secData">Copy my data</button><button type="button" class="btn w full" id="secDel" style="color:var(--cherry)">Delete my account</button>`;
 openSheet(`<form class="stack" id="secForm"><h2>Security and privacy</h2><div class="stack" id="secBody">${body()}</div><button type="button" class="btn full" id="secDone">Done</button></form>`,()=>{
  $("#secDone").onclick=closeSheet;
  $("#secForm").addEventListener("change",ev=>{const id=ev.target.id;if(id==="sec2"){A.twoStep=ev.target.checked;toast(A.twoStep?"Two step sign in is on.":"Two step sign in is off.");}if(id==="secAl")A.loginAlerts=ev.target.checked;if(id==="secPay")A.payoutLock=ev.target.checked;saveAcct();});
  $("#secForm").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
   if(b.dataset.signoutdev){b.outerHTML='<span class="pill">Signed out</span>';toast("Signed out of Chrome on Mac.");}
   if(b.id==="secData"){const data={account:{...A},tickets:S.orders.filter(isMine).map(o=>({event:(getEv(o.eventId)||{}).title,qty:o.qty,code:o.code,total:o.total})),profiles:S.profiles.filter(isMyProfile).map(p=>({name:p.name,role:p.role}))};copy(JSON.stringify(data,null,2),"Your data is copied. Paste it into a note to keep it.");}
   if(b.id==="secDel"){if(b.dataset.arm!=="1"){b.dataset.arm="1";b.textContent="Tap again to delete everything";return;}ACCT=null;try{["pu_account","pu_my_orders","pu_saved","pu_friends","pu_my_profiles"].forEach(k=>localStorage.removeItem(k));}catch(e){}closeSheet();renderNav();location.hash="#discover";openOnboarding("splash");toast("Your account was deleted.");}});});}
function fraudHtml(e){const h=hash(e.id),dup=S.dupScans.filter(x=>x===e.id).length;const flags=[[`${h%3+1} orders from the same card in under 2 minutes`,"Held for review"],[`${(h>>3)%2} ticket resale listings above face value`,"Blocked"],[`${dup} duplicate scan attempt${dup===1?"":"s"} at the door`,dup?"Stopped":"None"]];
 return `<div class="k" style="margin-top:6px">Fraud and safety</div>${flags.map(([t,s])=>`<div class="row between" style="font-size:13px"><span>🛡️ ${esc(t)}</span><span class="pill ${s==="None"?"":"pink"}">${s}</span></div>`).join("")}<span class="sub" style="font-size:12px">Live QR codes refresh every 30 seconds, so screenshots and copies don't scan.</span>`;}
/* live rotating ticket QR */
const qrWindow=()=>Math.floor(Date.now()/30000);
function liveQR(code){return code+"."+qrWindow().toString(36);}
setInterval(()=>{const els=document.querySelectorAll("[data-liveqr]");if(!els.length)return;const left=30-Math.floor(Date.now()/1000)%30;els.forEach(el=>{const v=liveQR(el.dataset.liveqr);if(el.dataset.qr!==v){el.dataset.qr=v;}});hydrateQR(document);document.querySelectorAll("[data-qrleft]").forEach(x=>{x.textContent="Live code · refreshes in "+left+"s";});document.querySelectorAll("[data-qrbar]").forEach(x=>{x.style.width=(left/30*100)+"%";});},1000);

/* ---------- easier event editing: quick edit, status, inline edit, demo persistence ---------- */
const canEdit=e=>signedIn()&&(mode()==="organizing"||(ACCT.brand&&ACCT.brand.name===e.host));
const evStatus=e=>e.status||"live";
const STATUS_LABEL={live:"Live",paused:"Sales paused",draft:"Draft",canceled:"Canceled"};
function quickEditSheet(src){const e=clean(src);e.tiers=e.tiers||[];
 const row=(t,i)=>{const sold=soldFor(src,t.id);return `<div class="qrow"><div class="field"><label for="qn${i}">Ticket</label><input id="qn${i}" data-qt="${i}:name" value="${esc(t.name)}"></div><div class="field"><label for="qp${i}">Price $</label><input id="qp${i}" data-qt="${i}:price" type="number" min="0" step="1" value="${esc(t.price)}"></div><div class="field"><label for="qq${i}">Qty</label><input id="qq${i}" data-qt="${i}:qty" type="number" min="${sold||1}" step="1" value="${esc(t.qty)}"></div><span class="sub" style="font-size:11px;grid-column:1/-1">${sold} sold · guests pay ${Number(t.price)>0?money2(allIn(Number(t.price))):"nothing"}${sold?" · can't go below "+sold:""}</span></div>`;};
 const body=()=>`<div class="lbl">Status</div><div class="row wrap" style="gap:6px">${["live","paused","draft","canceled"].map(s=>`<button type="button" class="chip" data-qs="${s}" aria-pressed="${evStatus(e)===s}">${STATUS_LABEL[s]}</button>`).join("")}</div>
  <div class="sub" style="font-size:12px;margin-top:-4px">${{live:"On Discover and selling.",paused:"Still on Discover, but nobody can buy until you resume.",draft:"Hidden from Discover. Only your team sees it.",canceled:"Hidden and marked canceled. Refund guests from the Guests tab."}[evStatus(e)]}</div>
  <div class="field"><label for="qTitle">Event name</label><input id="qTitle" data-qk="title" value="${esc(e.title)}"></div>
  <div class="grid2"><div class="field"><label for="qDate">Date</label><input id="qDate" type="date" data-qk="date" value="${esc(e.date)}"></div><div class="field"><label for="qArea">Neighborhood</label><select id="qArea" data-qk="area">${NEIGHBORHOODS.concat(["Other Atlanta"]).map(n=>`<option ${e.area===n?"selected":""}>${n}</option>`).join("")}</select></div></div>
  <div class="grid2"><div class="field"><label for="qStart">Doors</label><input id="qStart" type="time" data-qk="start" value="${esc(e.start)}"></div><div class="field"><label for="qEnd">Ends</label><input id="qEnd" type="time" data-qk="end" value="${esc(e.end||"")}"></div></div>
  <div class="field"><label for="qVenue">Venue (public)</label><input id="qVenue" data-qk="venue" value="${esc(e.venue||"")}"></div>
  <div class="field"><label for="qAddr">Exact address</label><input id="qAddr" data-qk="address" value="${esc(e.address||"")}"></div>
  <div class="lbl">Tickets</div><div class="stack" style="gap:8px">${e.tiers.map(row).join("")}</div>
  <button type="button" class="btn w sm" data-qaddtier="1" style="align-self:flex-start">+ Add a ticket type</button>`;
 openSheet(`<form class="stack" id="qeForm"><div class="row between"><h2>Quick edit</h2><button type="button" class="btn w sm" id="qeFull">Full editor</button></div><span class="sub">${esc(src.title)} · changes go live when you save.</span><div class="stack" id="qeBody">${body()}</div>
  <div class="savebar"><button type="button" class="btn w" id="qeCancel">Cancel</button><button class="btn" id="qeSave">Save changes</button></div></form>`,()=>{
  const f=$("#qeForm");let dirty=false;const mark=()=>{dirty=true;$("#qeSave").textContent="Save changes •";};
  f.addEventListener("input",ev=>{const el=ev.target;if(el.dataset.qk){e[el.dataset.qk]=el.value;mark();}if(el.dataset.qt){const [i,k]=el.dataset.qt.split(":");e.tiers[+i][k]=k==="name"?el.value:Number(el.value);mark();const sp=el.closest(".qrow").querySelector(".sub");const t=e.tiers[+i];const sold=soldFor(src,t.id);sp.textContent=`${sold} sold · guests pay ${Number(t.price)>0?money2(allIn(Number(t.price))):"nothing"}${sold?" · can't go below "+sold:""}`;}});
  f.addEventListener("change",ev=>{if(ev.target.tagName==="SELECT"&&ev.target.dataset.qk){e[ev.target.dataset.qk]=ev.target.value;mark();}});
  f.addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;
   if(b.dataset.qs){e.status=b.dataset.qs;mark();$("#qeBody").innerHTML=body();}
   if(b.dataset.qaddtier){e.tiers.push({id:"t"+Math.random().toString(36).slice(2,6),name:"General",price:15,qty:100,desc:"",color:"butter",maxPerOrder:6});mark();$("#qeBody").innerHTML=body();}});
  $("#qeCancel").onclick=()=>{if(dirty&&$("#qeCancel").dataset.arm!=="1"){$("#qeCancel").dataset.arm="1";$("#qeCancel").textContent="Discard changes?";return;}closeSheet();};
  $("#qeFull").onclick=()=>{closeSheet();eventSheet(dirty?e:src);};
  f.addEventListener("submit",async ev=>{ev.preventDefault();
   if(!String(e.title||"").trim()||!e.date){toast("Add a name and a date.");return;}
   for(const t of e.tiers){const sold=soldFor(src,t.id);if(Number(t.qty)<sold){toast(`${t.name} already sold ${sold}. Quantity can't be lower than that.`);return;}t.price=Math.max(0,Number(t.price)||0);t.qty=Math.max(1,Math.round(Number(t.qty)||1));}
   e.updatedAt=Date.now();if(await writeDoc("events",e,S.events)){closeSheet();toast(e.status==="paused"?"Saved. Sales are paused.":e.status==="draft"?"Saved as a draft.":e.status==="canceled"?"Event canceled.":"Saved. Changes are live.");}});
 });}
async function toggleSales(e){const ne={...clean(e),status:evStatus(e)==="paused"?"live":"paused"};if(await writeDoc("events",ne,S.events))toast(ne.status==="paused"?"Sales paused. Nobody can buy until you resume.":"Sales are back on.");}
/* demo mode keeps changes in this browser (for Netlify and other static hosting) */
const DEMO_KEYS=["events","orders","groups","lists","payouts","profiles","requests","fits","waitlist","follows","blasts","staff","ambassadors","earlyaccess","referrals"];
let demoSaveT=null;
function saveDemo(){if(S.mode!=="demo")return;clearTimeout(demoSaveT);demoSaveT=setTimeout(()=>{try{const o={v:1,at:Date.now()};DEMO_KEYS.forEach(k=>o[k]=S[k]);localStorage.setItem("pu_demo_state",JSON.stringify(o));}catch(err){/* storage full or blocked: keep running in memory */}},300);}
function loadDemo(){try{const o=JSON.parse(localStorage.getItem("pu_demo_state")||"null");if(!o||o.v!==1)return false;DEMO_KEYS.forEach(k=>{if(Array.isArray(o[k]))S[k]=o[k];});return true;}catch(e){return false;}}
function resetDemo(){try{localStorage.removeItem("pu_demo_state");}catch(e){}location.reload();}

/* ---------- writes (live store or in memory) ---------- */
function writeFail(err){const c=err&&err.code;if(c==="invalid_argument"){S.readOnly=true;toast("You have view only access, so this can't be saved.");}else if(c==="quota_exceeded")toast("Storage is full. Delete old events to make room.");else toast("Couldn't save. Try again in a moment.");render();}
const live=()=>S.mode==="live";
function clean(o){return JSON.parse(JSON.stringify(o));}
async function writeDoc(col,obj,arr){if(live()){try{await S.db.collection(col).doc(obj.id).set(clean(obj));return true;}catch(err){writeFail(err);return false;}}const i=arr.findIndex(x=>x.id===obj.id);if(i>=0)arr[i]=obj;else arr.push(obj);render();return true;}
async function removeDoc(col,id,key){if(live()){try{await S.db.collection(col).doc(id).delete();return true;}catch(err){writeFail(err);return false;}}S[key]=S[key].filter(x=>x.id!==id);render();return true;}
async function joinGroup(g,m){const cur=getGroup(g.id);const members=[...((cur&&cur.members)||g.members||[]),m];const body={...(cur||g),members};if(!cur||body.organizer==="Your")body.organizer=members[0].name.split(" ")[0];return writeDoc("groups",body,S.groups);}
async function checkInKey(key){const [kind,id]=[key.slice(0,1),key.slice(2)];
 if(kind==="o"){const o=S.orders.find(x=>x.id===id);if(!o||o.checkedIn)return null;return (await writeDoc("orders",{...o,checkedIn:true,checkedInAt:Date.now()},S.orders))?{name:o.name,qty:o.qty||1}:null;}
 const [lid,j]=id.split("|");const l=getList(lid);if(!l)return null;const entries=(l.entries||[]).map((x,k)=>k===+j?{...x,checkedIn:true,checkedInAt:Date.now()}:x);const x=entries[+j];
 return (await writeDoc("lists",{...l,entries},S.lists))?{name:x.name,qty:x.plus?2:1,list:l.owner}:null;}

 const bk=t.closest("[data-book]");if(bk){const p=getProfile(bk.dataset.book);if(p)requestSheet(p,"book",S.bookFor||null);return;}
 const mp=t.closest("[data-msgp]");if(mp){const p=getProfile(mp.dataset.msgp);if(p)requestSheet(p,"message",null);return;}
 const ep=t.closest("[data-editprofile]");if(ep){const p=getProfile(ep.dataset.editprofile);if(p)profileSheet(p);return;}
 const rs=t.closest("[data-reqst]");if(rs){const [id,st]=rs.dataset.reqst.split(":");setRequestStatus(id,st);return;}
 const bc=t.closest("[data-bookcrew]");if(bc){S.bookFor=bc.dataset.bookcrew;location.hash="#crew";return;}
 if(t.closest("#cashOut")){cashOutSheet();return;}
 if(t.closest("#payHist")){payHistSheet();return;}
 if(t.closest("#addPromo")){const e=getEv(S.hostEvent);if(e)promoterSheet(e);return;}
 const nl=t.closest("[data-newlist]");if(nl){listSheet(nl.dataset.newlist,null);return;}
 const el=t.closest("[data-editlist]");if(el){const l=getList(el.dataset.editlist);if(l)listSheet(l.eventId,l);return;}
 const an=t.closest("[data-addname]");if(an){const l=getList(an.dataset.addname);if(l)addNameSheet(l);return;}
 const cm=t.closest("[data-comp]");if(cm){const e=getEv(cm.dataset.comp);if(e)compSheet(e);return;}
 const ed=t.closest("[data-edit]");if(ed){eventSheet(getEv(ed.dataset.edit));return;}
 const dr=t.closest("[data-door]");if(dr){S.doorEvent=dr.dataset.door;S.doorResult=null;S.doorQuery="";location.hash="#door";return;}
 const hv=t.closest("[data-hv]");if(hv){S.hostView=hv.dataset.hv;render();return;}
 const li=t.closest("[data-in]");if(li){const r=await checkInKey(li.dataset.in);if(r){S.doorResult={k:"ok",msg:`${r.name} is in${r.qty>1?" with a plus one":""}${r.list?" ("+r.list+"'s list)":""}.`};render();}return;}
});
document.addEventListener("change",ev=>{if(ev.target.closest("#layer"))return;const id=ev.target.id;
 if(id==="doorEv"){S.doorEvent=ev.target.value;S.doorResult=null;S.doorQuery="";render();}
 if(id==="hood"){S.hood=ev.target.value;render();}
 if(id==="hostEv"){S.hostEvent=ev.target.value;render();}
 if(id==="crewArea"){S.crewArea=ev.target.value;render();}});
document.addEventListener("input",ev=>{if(ev.target.closest("#layer"))return;const id=ev.target.id;
 if(id==="doorCode"){S.doorQuery=ev.target.value;S.doorResult=null;render();}
 if(id==="q"){S.q=ev.target.value;render();}
 if(id==="crewQ"){S.crewQ=ev.target.value;render();}});
document.addEventListener("submit",async ev=>{const f=ev.target;
 if(f.id==="unlockForm"){ev.preventDefault();const e=getEv(route().id);const c=$("#unlock").value.trim().toUpperCase();const hit=(e.tiers||[]).filter(t=>t.hidden&&(t.code||"").toUpperCase()===c);if(hit.length){S.unlocked[e.id]=[...(S.unlocked[e.id]||[]),...hit.map(t=>t.id)];toast("Unlocked "+hit.map(t=>t.name).join(", ")+".");render();}else toast("That code doesn't unlock anything here.");return;}
 if(f.id==="listForm"){ev.preventDefault();const l=getList(f.dataset.list);const n=$("#lName").value.trim();if(n&&await addToList(l,n,$("#lPlus").checked)){toast("You're on "+l.owner+"'s list. Bring your ID.");render();}return;}
 if(f.dataset&&f.dataset.upd){ev.preventDefault();const e=getEv(f.dataset.upd);const v=f.querySelector("input").value.trim();if(!v||!e)return;const ne={...clean(e),updates:[...(e.updates||[]),{msg:v,at:Date.now()}].slice(-20)};if(await writeDoc("events",ne,S.events))toast("Posted. Guests see it on the event page.");return;}
 if(f.id==="joinForm"){ev.preventDefault();const r=f.dataset.role;const x={id:rid("ea"),role:r,ref:f.dataset.ref||null,name:$("#jnName").value.trim(),brand:($("#jnBrand")||{}).value||"",insta:$("#jnIg").value.trim().replace(/^@/,""),contact:$("#jnPhone").value.trim(),userId:me(),createdAt:Date.now()};if(!x.name||!x.contact)return;
  if(await writeDoc("earlyaccess",x,S.earlyaccess)){if(ACCT&&ACCT.onboarded&&!ACCT.browsing){ACCT.plan={...(ACCT.plan||{})};if(r==="organizer"){ACCT.plan.founding=true;}else{ACCT.plan.crew="pro";ACCT.plan.crewTrialEnds=Date.now()+180*864e5;ACCT.plan.foundingCrew=true;}saveAcct();}toast("You're on the founding list. Welcome to Pull Up!");render();}return;}
 if(f.id!=="doorForm")return;ev.preventDefault();
 const q=S.doorQuery.trim().toUpperCase().split(".")[0];if(!q)return;const e=getEv(S.doorEvent);
 const o=S.orders.find(x=>x.code.toUpperCase()===q);
 if(!o){if(doorEntries(e).some(x=>x.name.toUpperCase().includes(q)))return;S.doorResult={k:"no",msg:"No ticket with that code. Don't let it in."};}
 else if(o.status==="refunded")S.doorResult={k:"no",msg:"This ticket was refunded. Don't let it in."};
 else if(o.eventId!==e.id)S.doorResult={k:"no",msg:`That ticket is for ${(getEv(o.eventId)||{}).title||"another event"}.`};
 else if(o.checkedIn){S.dupScans.push(e.id);S.doorResult={k:"dup",msg:`${o.name} already checked in. This code was used.`};}
 else{const r=await checkInKey("o:"+o.id);if(r)S.doorResult={k:"ok",msg:`${r.name} is in${r.qty>1?" with "+(r.qty-1)+" more":""}.`};}
 S.doorQuery="";render();
});

/* ---------- night mode ---------- */
function applyTheme(night){document.documentElement.classList.toggle("night",night);const b=$("#themeBtn");if(b){b.textContent=night?"☀️":"🌙";b.setAttribute("aria-label",night?"Switch to day mode":"Switch to night mode");}}
(function(){let saved=null;try{saved=localStorage.getItem("pu_theme");}catch(e){}
 const host=document.documentElement.getAttribute("data-theme");
 const sys=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
 applyTheme(saved?saved==="night":host?host==="dark":sys);})();
document.getElementById("themeBtn").addEventListener("click",()=>{const n=!document.documentElement.classList.contains("night");applyTheme(n);try{localStorage.setItem("pu_theme",n?"night":"day");}catch(e){}toast(n?"Night mode on.":"Day mode on.");});
/* ---------- boot ---------- */
renderNav();
if((!ACCT||!ACCT.onboarded)&&!location.hash.startsWith("#join-"))setTimeout(()=>openOnboarding("splash"),50);
function startDemo(){S.mode="demo";if(loadDemo()){render();return;}S.events=applyExtras(clean(DEMO_EVENTS));S.fits=clean(DEMO_FITS);S.waitlist=[];S.ambassadors=[{id:"am-s1",eventId:"lights-out-friday",name:"Tasha P.",insta:"tashagoesout",why:"I bring 20 people every party",status:"pending",userId:"s",createdAt:Date.now()-36e5,sample:true}];S.orders=demoOrders();S.lists=clean(DEMO_LISTS);S.groups=[];S.profiles=clean(DEMO_PROFILES);S.requests=[{id:"rq-s1",profileId:"pr-peach",kind:"booking",fromName:"Velvet Hour ATL",eventId:"lights-out-friday",offer:280,message:"4 guards, 9:30 PM to 3 AM, ID and bag checks.",status:"accepted",createdAt:Date.now()-2*864e5,sample:true},{id:"rq-s2",profileId:"pr-noir",kind:"booking",fromName:"Velvet Hour ATL",eventId:"lights-out-friday",offer:300,message:"Headline set 12 to 2.",status:"accepted",createdAt:Date.now()-3*864e5,sample:true},{id:"rq-s3",profileId:"pr-flash",kind:"booking",fromName:"Throwback ATL",eventId:"y2k-rewind",offer:350,message:"Y2K backdrop please.",status:"pending",createdAt:Date.now()-864e5,sample:true}];S.payouts=[{id:"po-sample",amount:820,fee:0,type:"standard",status:"Paid",createdAt:Date.now()-9*864e5,sample:true}];render();}
async function boot(){
 render();
 const inClaude=window.parent!==window||/claude|anthropic/.test(location.hostname);
 for(let i=0;inClaude&&i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));
 if(!(window.claude&&window.claude.use)){startDemo();return;}
 let db=null,user=null;try{db=await window.claude.use("db");}catch(e){}
 if(!db){startDemo();return;}
 try{user=await window.claude.use("user");if(user)S.uid=await user.id();}catch(e){}
 try{if(user&&user.can){const w=await user.can("data.write");if(w===false)S.readOnly=true;}}catch(e){}
 S.db=db;let gotE=false;
 const timer=setTimeout(()=>{if(!gotE){S.stale=true;if(S.mode==="loading")S.mode="live";render();}},10000);
 db.collection("events").onSnapshot(snap=>{S.events=snap.docs.map(d=>({...d.data(),id:d.id}));if(!snap.metadata.fromCache){gotE=true;clearTimeout(timer);S.stale=false;}S.mode="live";render();},()=>{clearTimeout(timer);S.mode="live";S.stale=true;render();});
 for(const col of ["orders","groups","lists","payouts","profiles","requests","fits","waitlist","follows","blasts","staff","ambassadors","earlyaccess","referrals"])db.collection(col).onSnapshot(snap=>{S[col]=snap.docs.map(d=>({...d.data(),id:d.id}));render();},()=>{});
}
boot();
})();
</script>
